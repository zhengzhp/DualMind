name: Feature request
description: 提议新能力或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 [docs/decisions.md](../blob/main/docs/decisions.md) 的产品边界。V3.1+ 范围需要先立项。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景与现有方案的不足，而不是先给实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: 是否需要新增权限 / 依赖？
      description: 新增 host_permissions、debugger、scripting、tabs 或第三方库都需要额外评估。
  - type: checkboxes
    id: scope
    attributes:
      label: 边界确认
      options:
        - label: 该能力不涉及跨 Tab 自动化、debugger/CDP、PDF、自有后端或云同步。
          required: true
