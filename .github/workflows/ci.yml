name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本以 package.json 的 packageManager 为准
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # postinstall 会执行 `wxt prepare`，生成 .wxt 类型
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm compile

      # 仅跑 Vitest 单测（纯逻辑，无外部依赖）
      # E2E 依赖真实本地 Ollama 与非 headless 浏览器，不适合放 CI，本地执行 `pnpm test:e2e`
      - name: Unit tests
        run: pnpm test
