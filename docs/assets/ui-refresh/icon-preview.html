<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:transparent}</style></head>
<body>
<div id="icon" style="width:128px;height:128px">
  <svg id="svg" width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
    <rect x="16" y="16" width="96" height="96" rx="22" fill="#1466AD"/>
    <g id="mark" transform="translate(35.2,30.4) scale(0.24)">
      <path id="path" fill="#ffffff" d="M22 0 H100 A140 140 0 0 1 100 280 H22 A22 22 0 0 1 0 258 V22 A22 22 0 0 1 22 0 Z"/>
    </g>
  </svg>
</div>
<script>
  window.setIcon = (size, simple) => {
    const el = document.getElementById('icon');
    el.style.width = size + 'px'; el.style.height = size + 'px';
    const svg = document.getElementById('svg');
    svg.setAttribute('width', size); svg.setAttribute('height', size);
    document.getElementById('path').setAttribute('mask', simple ? '' : 'url(#foldMask)');
    if (!simple && !document.getElementById('foldMask')) {
      const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
      defs.innerHTML = '<mask id="foldMask"><rect x="0" y="0" width="240" height="280" fill="#ffffff"/><rect x="30" y="30" width="20" height="220" rx="4" fill="#000000"/></mask>';
      svg.insertBefore(defs, svg.firstChild);
    }
    document.getElementById('path').setAttribute('mask', simple ? '' : 'url(#foldMask)');
  };
</script>
</body></html>
