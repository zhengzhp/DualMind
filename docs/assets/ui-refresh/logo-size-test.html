<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:#F2F2F4;font-family:-apple-system,"PingFang SC",sans-serif;color:#0F2F4D}
  .board{width:1200px;padding:40px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{font-size:12px;color:#6E6E73;margin:0 0 28px}
  .row{display:flex;align-items:flex-end;gap:36px;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid #E2E2E6}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px}
  .lbl{font-size:10px;color:#8A8F98}
  .zoom{transform:scale(8);transform-origin:top left;image-rendering:pixelated}
  .zoomwrap{width:128px;height:152px;overflow:hidden}
</style></head><body>
<div class="board">
  <h1>双页 · 16px 实测（1:1 与 8× 放大）</h1>
  <p class="sub">A 当前（折缝 10.8% / 左页 9.2%） · B 收窄（8.3% / 12.5%） · C 再收窄（6.7% / 15%）</p>
  <div id="rows"></div>
</div>
<script>
  const variants = [
    { id:'A', slot:0.108, inset:0.092 },
    { id:'B', slot:0.083, inset:0.125 },
    { id:'C', slot:0.067, inset:0.150 },
  ];
  const sizes = [16,24,32,48];
  const ink = '#0F2F4D', bg = '#F2F2F4';
  function mark(w, v){
    const h = Math.round(w*1.166), slot = Math.max(1, Math.round(w*v.slot)), inset = Math.max(1, Math.round(w*v.inset));
    const el = document.createElement('div');
    el.style.cssText = 'display:flex;flex-direction:row;justify-content:flex-start;align-items:stretch;background:'+ink+';border-radius:'+Math.round(w*0.09)+'px '+Math.round(h/2)+'px '+Math.round(h/2)+'px '+Math.round(w*0.09)+'px;padding:'+inset+'px;width:'+w+'px;height:'+h+'px;box-sizing:border-box';
    const slotEl = document.createElement('div');
    slotEl.style.cssText = 'width:'+slot+'px;height:100%;background:'+bg+';border-radius:'+Math.max(1,Math.round(slot/4))+'px;flex:none';
    el.appendChild(slotEl);
    return el;
  }
  const rows = document.getElementById('rows');
  for (const v of variants){
    const row = document.createElement('div'); row.className='row';
    for (const s of sizes){
      const col=document.createElement('div'); col.className='col';
      col.appendChild(mark(s, v));
      const l=document.createElement('div'); l.className='lbl'; l.textContent=v.id+' · '+s+'px'; col.appendChild(l);
      row.appendChild(col);
    }
    const z=document.createElement('div'); z.className='col';
    const zw=document.createElement('div'); zw.className='zoomwrap';
    const zm=mark(16,v); const iner=document.createElement('div'); iner.className='zoom'; iner.appendChild(zm); zw.appendChild(iner);
    z.appendChild(zw);
    const zl=document.createElement('div'); zl.className='lbl'; zl.textContent=v.id+' · 16px ×8'; z.appendChild(zl);
    row.appendChild(z);
    rows.appendChild(row);
  }
</script>
</body></html>
