<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:#F2F2F4;font-family:-apple-system,"PingFang SC",sans-serif;color:#0F2F4D}
  .board{width:1100px;padding:36px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{font-size:12px;color:#6E6E73;margin:0 0 24px}
  .row{display:flex;align-items:flex-end;gap:30px;margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid #E2E2E6}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .item span{font-size:10px;color:#8A8F98}
  .dark{background:#0A1C2B;padding:16px;border-radius:12px}
  .zoom img{image-rendering:pixelated;width:128px;height:128px}
  .mark{width:120px;height:auto;display:block}
  .card{background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;width:260px;height:200px}
  .card.dark{background:#0A1C2B}
</style></head><body>
<div class="board">
  <h1>双页 · B 档（折缝 8.3%）· 生产预览</h1>
  <p class="sub">Chrome 图标：96 图形 + 16 边距；16/32 使用实心简化标（折缝在 6px 标记里不可见）</p>
  <div class="row">
    <div class="item"><img src="icon-128.png" width="128" height="128"><span>128</span></div>
    <div class="item"><img src="icon-48.png" width="48" height="48"><span>48</span></div>
    <div class="item"><img src="icon-32.png" width="32" height="32"><span>32</span></div>
    <div class="item"><img src="icon-16.png" width="16" height="16"><span>16</span></div>
    <div class="item zoom"><img src="icon-16.png"><span>16 ×8</span></div>
    <div class="item"><div class="dark"><img src="icon-16.png" width="16" height="16"></div><span>16 on dark</span></div>
  </div>
  <div class="row" style="align-items:center">
    <div class="card"><svg class="mark" viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg">
  <defs><mask id="m1"><rect x="0" y="0" width="240" height="280" fill="#fff"/><rect x="30" y="30" width="20" height="220" rx="4" fill="#000"/></mask></defs>
  <path fill="#0F2F4D" mask="url(#m1)" d="M22 0 H100 A140 140 0 0 1 100 280 H22 A22 22 0 0 1 0 258 V22 A22 22 0 0 1 22 0 Z"/>
</svg></div>
    <div class="card dark"><svg class="mark" viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg">
  <defs><mask id="m2"><rect x="0" y="0" width="240" height="280" fill="#fff"/><rect x="30" y="30" width="20" height="220" rx="4" fill="#000"/></mask></defs>
  <path fill="#FFFFFF" mask="url(#m2)" d="M22 0 H100 A140 140 0 0 1 100 280 H22 A22 22 0 0 1 0 258 V22 A22 22 0 0 1 22 0 Z"/>
</svg></div>
    <div class="card" style="width:200px"><svg class="mark" viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg">
  <defs><mask id="m3"><rect x="0" y="0" width="240" height="280" fill="#fff"/><rect x="30" y="30" width="20" height="220" rx="4" fill="#000"/></mask></defs>
  <path fill="#1466AD" mask="url(#m3)" d="M22 0 H100 A140 140 0 0 1 100 280 H22 A22 22 0 0 1 0 258 V22 A22 22 0 0 1 22 0 Z"/>
</svg></div>
    <div class="item"><span>墨蓝 / 反白 / 品牌蓝</span></div>
  </div>
</div>
</body></html>
