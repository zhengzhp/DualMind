<main data-name="Two-Pages-Refine-v1" class="flex flex-col justify-start items-start w-[1744px] h-[760px] bg-[#F2F2F4] p-[56px] gap-[28px]">
  <div data-name="refine-header" class="flex flex-row justify-between items-end w-[1632px]">
    <p data-name="refine-title" class="w-[900px] text-[26px] leading-[32px] font-[600] text-[#0F2F4D] text-left">双页 · 细化 v1</p>
    <p data-name="refine-note" class="w-[700px] text-[13px] leading-[18px] font-[400] text-[#6E6E73] text-right">同一方向三种收法：D 形右页 / 等高双页 / 单页折缝</p>
  </div>
  <div data-name="refine-cards" class="flex flex-row justify-start items-start w-[1632px] gap-[48px]">
    <div data-name="refine-card-v1" class="flex flex-col justify-between items-center w-[512px] h-[580px] bg-[#FFFFFF] rounded-[20px] p-[32px]">
      <div data-name="refine-mark-v1" class="flex flex-row justify-center items-end w-[448px] h-[420px]">
        <div data-name="v1-group" class="flex flex-row justify-center items-end gap-[10px] w-[400px] h-[380px]">
          <div data-name="v1-page-left" class="w-[86px] h-[190px] bg-[#0F2F4D] rounded-[16px]"></div>
          <div data-name="v1-page-right" class="flex flex-row justify-start items-stretch w-[150px] h-[270px] bg-[#0F2F4D] rounded-l-[10px] rounded-r-[120px] p-[18px]">
            <div data-name="v1-fold" class="w-[6px] h-[234px] bg-[#FFFFFF] rounded-[3px]"></div>
          </div>
        </div>
      </div>
      <div data-name="refine-label-v1" class="flex flex-col justify-start items-start w-[448px] gap-[8px]">
        <span data-name="v1-title" class="text-[18px] leading-[24px] font-[600] text-[#0F2F4D] text-left">V1 · D 形右页</span>
        <p data-name="v1-note" class="w-[448px] text-[12px] leading-[19px] font-[400] text-[#6E6E73] text-left">右页外缘收成半圆，外轮廓直接读作 D；左页做短栏，折缝 6px。</p>
      </div>
    </div>
    <div data-name="refine-card-v2" class="flex flex-col justify-between items-center w-[512px] h-[580px] bg-[#FFFFFF] rounded-[20px] p-[32px]">
      <div data-name="refine-mark-v2" class="flex flex-row justify-center items-center w-[448px] h-[420px]">
        <div data-name="v2-group" class="flex flex-row justify-center items-center gap-[10px] w-[400px] h-[380px]">
          <div data-name="v2-page-left" class="w-[110px] h-[250px] bg-[#0F2F4D] rounded-[16px]"></div>
          <div data-name="v2-page-right" class="w-[150px] h-[250px] bg-[#0F2F4D] rounded-l-[10px] rounded-r-[125px]"></div>
        </div>
      </div>
      <div data-name="refine-label-v2" class="flex flex-col justify-start items-start w-[448px] gap-[8px]">
        <span data-name="v2-title" class="text-[18px] leading-[24px] font-[600] text-[#0F2F4D] text-left">V2 · 等高双页</span>
        <p data-name="v2-note" class="w-[448px] text-[12px] leading-[19px] font-[400] text-[#6E6E73] text-left">两页同高，比例更克制；缩到 16px 时两栏仍能分开。</p>
      </div>
    </div>
    <div data-name="refine-card-v3" class="flex flex-col justify-between items-center w-[512px] h-[580px] bg-[#FFFFFF] rounded-[20px] p-[32px]">
      <div data-name="refine-mark-v3" class="flex flex-row justify-center items-center w-[448px] h-[420px]">
        <div data-name="v3-page" class="flex flex-row justify-start items-stretch w-[230px] h-[270px] bg-[#0F2F4D] rounded-l-[20px] rounded-r-[135px] p-[24px]">
          <div data-name="v3-fold" class="w-[8px] h-[222px] bg-[#FFFFFF] rounded-[4px]"></div>
        </div>
      </div>
      <div data-name="refine-label-v3" class="flex flex-col justify-start items-start w-[448px] gap-[8px]">
        <span data-name="v3-title" class="text-[18px] leading-[24px] font-[600] text-[#0F2F4D] text-left">V3 · 单页折缝</span>
        <p data-name="v3-note" class="w-[448px] text-[12px] leading-[19px] font-[400] text-[#6E6E73] text-left">只留一页，用折缝暗示「两种语言」；剪影最完整，适合 16px。</p>
      </div>
    </div>
  </div>
</main>
